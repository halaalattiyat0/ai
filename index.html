<style>
  :root {
    /* Layout idea: eight story screens, one idea each. A big drawing carries the idea, one sentence names it, one tap moves on. The outreach email frames it: its sky header and red rule on top, its green WhatsApp button, and notebook tabs along the bottom edge. */
    --red: #B30D12;
    --red-hi: #D0080F;
    --red-lo: #8E0107;
    --blue: #2F6FA8;
    --blue-ink: #245A8C;
    --sky: #9CC3EA;
    --sky-1: #DCE8F6;
    --sky-2: #F4F8FD;
    --ink: #14213A;
    --muted: #41506B;
    --green: #5B8F2E;
    --green-ink: #3F6B1F;
    --green-hi: #A5D46F;
    --wa: #388E3C;
    --wa-lo: #1F5F27;
    --navy: #0F1C2D;
    --display: 'Jost', 'Poppins', 'Century Gothic', 'Avenir Next', 'Segoe UI', sans-serif;
    --body: 'Hanken Grotesk', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif;
    --lh: 1.6;
    --lh-h: 1.12;
    --lh-s: 1.35;
    --track: -.012em;
    --dirx: 1;
    color-scheme: light;
  }
  :root[lang="ar"] {
    --display: 'Alexandria', 'Tajawal', 'Segoe UI', 'Geeza Pro', 'Noto Sans Arabic', Tahoma, sans-serif;
    --body: 'IBM Plex Sans Arabic', 'Segoe UI', 'Geeza Pro', 'Noto Sans Arabic', Tahoma, sans-serif;
    --lh: 1.85;
    --lh-h: 1.4;
    --lh-s: 1.6;
    --track: 0;
  }
  :root[dir="rtl"] { --dirx: -1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky-1); color: var(--ink); font: 400 17px/var(--lh) var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button { font: inherit; color: inherit; }
  img, svg { display: block; max-width: 100%; }
  img { height: auto; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .dir { transform: scaleX(-1); }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Shell */
  .app { height: 100%; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .top { position: relative; z-index: 30; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 20px; background: linear-gradient(180deg, #D1E1F3 0%, #F0F6FC 100%); }
  .brand { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .brand img { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--red); }
  .brand-t { display: grid; min-width: 0; }
  .brand b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 18px/1.3 var(--display); letter-spacing: .03em; color: var(--red); }
  :root[lang="ar"] .brand b { letter-spacing: 0; }
  .brand-t span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; line-height: 1.4; color: var(--blue-ink); }
  .chip { display: inline-flex; align-items: center; gap: 8px; flex: none; height: 38px; padding: 0 12px; border: 1px solid var(--sky); border-radius: 999px; background: #FFFFFF; color: var(--ink); font: 500 14px/1 var(--body); white-space: nowrap; cursor: pointer; }
  .chip .ic { width: 18px; height: 18px; color: var(--red); }
  .chip .caret { width: 14px; height: 14px; color: var(--muted); }
  .langs { display: inline-flex; flex: none; padding: 3px; border: 1px solid var(--sky); border-radius: 999px; background: #FFFFFF; }
  .langs button { min-width: 40px; height: 32px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: 600 13px/1 var(--body); cursor: pointer; }
  .langs button[lang="ar"] { font: 500 14px/1 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
  .rule { position: relative; z-index: 29; height: 4px; background: var(--red); }
  .rule i { display: block; height: 100%; width: 0; background: var(--sky-1); margin-inline-start: auto; transition: width .45s ease; }

  .stage { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, #FFFFFF 100%); }
  .screen { position: absolute; inset: 0; display: flex; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scr { flex: 1 0 auto; display: flex; width: 100%; }
  .scr-in { width: 100%; max-width: 1180px; margin: auto; padding: clamp(18px, 3.2vw, 40px) clamp(18px, 4vw, 48px) 100px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "vis" "bot"; gap: 22px; align-items: center; }
  .scr-in.tbv { grid-template-areas: "top" "bot" "vis"; }
  .t-top { grid-area: top; display: grid; gap: 12px; align-content: end; }
  .t-bot { grid-area: bot; display: grid; gap: 16px; align-content: start; }
  .vis { grid-area: vis; min-width: 0; }
  @media (min-width: 920px) {
    .scr-in, .scr-in.tbv { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "top vis" "bot vis"; grid-template-rows: auto auto; column-gap: clamp(32px, 4vw, 64px); row-gap: 22px; }
    .scr-in.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .t-top { align-self: end; }
    .t-bot { align-self: start; }
    .tbv .vis { align-self: start; position: sticky; top: 24px; }
    .scr-in, .scr-in.tbv { padding-top: clamp(16px, 3.4vh, 40px); padding-bottom: 36px; }
    .tbv h2 { font-size: clamp(28px, 3vw, 42px); }
    :root[lang="ar"] .tbv h2 { font-size: clamp(24px, 2.5vw, 34px); }
  }
  /* Tablets held upright: the long screens put their two halves side by side under the heading */
  @media (min-width: 700px) and (max-width: 919px) {
    .scr-in.split, .scr-in.tbv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
    .scr-in.split { grid-template-areas: "top top" "vis bot"; }
    .scr-in.tbv { grid-template-areas: "top top" "bot vis"; }
    .scr-in.split .t-bot, .scr-in.tbv .t-bot { align-self: center; }
  }
  .a { animation: up .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--k, 0) * 90ms); }
  .calm .a { animation: none; }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes slideF { from { opacity: 0; transform: translateX(calc(40px * var(--dirx))); } to { opacity: 1; transform: none; } }
  @keyframes slideB { from { opacity: 0; transform: translateX(calc(-40px * var(--dirx))); } to { opacity: 1; transform: none; } }
  .fwd .scr-in { animation: slideF .4s ease both; }
  .back .scr-in { animation: slideB .4s ease both; }

  /* Type and the one big action per screen */
  h1 { font: 300 clamp(38px, 5.2vw, 64px)/var(--lh-h) var(--display); letter-spacing: var(--track); text-wrap: balance; }
  h1 span { display: block; }
  h1 span + span { color: var(--red); font-weight: 400; }
  h2 { font: 400 clamp(30px, 3.9vw, 50px)/var(--lh-h) var(--display); letter-spacing: var(--track); text-wrap: balance; }
  h3 { font: 500 20px/var(--lh-s) var(--display); text-wrap: balance; }
  :root[lang="ar"] h1 { font-size: clamp(32px, 4.4vw, 54px); font-weight: 400; }
  :root[lang="ar"] h2 { font-size: clamp(26px, 3.2vw, 40px); }
  :root[lang="ar"] h3 { font-size: 18px; }
  .sub { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: var(--muted); max-width: 28em; text-wrap: pretty; }
  .go { justify-self: start; display: inline-flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 22px 0 28px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); color: #FFFFFF; font: 600 17px/1.25 var(--body); text-align: start; box-shadow: 0 14px 26px -10px rgba(142, 1, 7, .55); cursor: pointer; }
  :root[dir="rtl"] .go { padding: 0 28px 0 22px; }
  .go .ic { width: 22px; height: 22px; stroke-width: 2.2; transition: translate .2s; animation: nudge 1.4s ease-in-out 3.4s 3; }
  .go:hover .ic { translate: calc(5px * var(--dirx)) 0; }
  .hint { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--muted); }
  .hint .ic { width: 17px; height: 17px; color: var(--red); }
  .wa-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 22px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--wa), var(--wa-lo)); color: #FFFFFF; font: 600 16.5px/1.25 var(--body); text-decoration: none; box-shadow: 0 12px 24px -10px rgba(31, 95, 39, .6); cursor: pointer; }
  .wa-btn .ic { width: 21px; height: 21px; stroke-width: 2; }
  .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 1px solid var(--sky); border-radius: 12px; background: #FFFFFF; color: var(--blue-ink); font: 600 15px/1.2 var(--body); text-decoration: none; cursor: pointer; }
  .ghost .ic { width: 18px; height: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .mark { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 14px; color: #FFFFFF; }
  .t-red { background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); }
  .t-blue { background: linear-gradient(135deg, #3F86C6, #235A8D); }
  .t-green { background: linear-gradient(135deg, var(--green), var(--green-ink)); }
  .t-ink { background: linear-gradient(135deg, #2A3B5C, var(--ink)); }

  /* 1 Cover */
  .poster { position: relative; container-type: inline-size; overflow: hidden; width: min(100%, 520px); margin: 0 auto; border-radius: 26px; background: var(--sky-1); box-shadow: 0 30px 60px -28px rgba(20, 33, 58, .6); animation: float 7s ease-in-out infinite; }
  .poster img { width: 100%; }
  /* The cover: one picture for all languages; the banner, the four labels and the closing line are live text sized to the picture */
  .poster { width: min(100%, 520px, calc((100vh - 230px) * .948)); width: min(100%, 520px, calc((100svh - 230px) * .948)); }
  .cv-banner { position: absolute; left: 12.3%; top: 3.2%; width: 79.4%; height: 23.9%; display: grid; align-content: center; justify-items: center; row-gap: .2cqw; padding: 0 3.6cqw 2.2cqw; border-radius: 4.6cqw; background: linear-gradient(100deg, #F2121B 0%, #CC0810 38%, #96030A 100%); box-shadow: 0 1.8cqw 3.4cqw -0.6cqw rgba(90, 0, 4, .5), inset 0 .35cqw 0 rgba(255, 255, 255, .3), inset 0 -.8cqw 1.6cqw rgba(60, 0, 0, .28); color: #FFFFFF; font-family: 'Jost', 'Poppins', 'Century Gothic', sans-serif; transform: rotate(-.7deg) skewX(-2.6deg); }
  .cv-banner > p { transform: skewX(2.6deg); }
  .cv-l1 { display: flex; align-items: center; gap: .2em; width: max-content; font-size: calc(12.2cqw * var(--s, 1)); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .cv-l2 { display: flex; align-items: baseline; width: max-content; margin-inline-start: 6%; font-size: calc(7.1cqw * var(--s, 1)); font-weight: 400; line-height: 1.1; white-space: pre; }
  .cv-tile { display: inline-grid; place-items: center; height: 1.04em; padding: 0 .15em; border-radius: .2em; background: #FFFFFF; color: #C8070E; font-family: 'Jost', 'Poppins', sans-serif; font-size: 1.12em; font-weight: 700; letter-spacing: -.04em; box-shadow: inset 0 -.04em 0 rgba(0, 0, 0, .12); }
  .cv-b { font-weight: 700; font-size: 1.14em; }
  .cv-swoosh { position: absolute; right: 5.5%; bottom: 2.4%; width: 38%; height: auto; transform: skewX(2.6deg); }
  .cv-swoosh path { fill: none; stroke: #FFFFFF; stroke-width: 3.2; stroke-linecap: round; }
  :root[lang="ar"] .cv-banner { font-family: 'Alexandria', 'Tajawal', 'Segoe UI', sans-serif; }
  :root[lang="ar"] .cv-l1 { font-size: calc(10.6cqw * var(--s, 1)); line-height: 1.1; }
  :root[lang="ar"] .cv-l2 { font-size: calc(6.4cqw * var(--s, 1)); line-height: 1.3; }
  :root[lang="ar"] .cv-swoosh { right: auto; left: 5.5%; transform: skewX(2.6deg) scaleX(-1); }
  .cv-lbl { position: absolute; transform: translateX(-50%); color: #FFFFFF; font: 500 1.9cqw/1.18 'Jost', 'Poppins', sans-serif; text-align: center; white-space: pre; text-shadow: 0 .1cqw .6cqw rgba(15, 28, 45, .55); pointer-events: none; }
  .cv-tag { position: absolute; left: 51.4%; top: 87.6%; display: grid; justify-items: center; transform: translateX(-50%); color: #FFFFFF; font: 500 2.75cqw/1.08 'Jost', 'Poppins', sans-serif; white-space: nowrap; text-shadow: 0 .15cqw .7cqw rgba(8, 28, 12, .65); pointer-events: none; }
  .cv-tag span:first-child { display: flex; align-items: center; gap: 1.3cqw; }
  .cv-tag span:first-child::before, .cv-tag span:first-child::after { content: ""; width: 7.6cqw; height: .2cqw; background: rgba(255, 255, 255, .85); box-shadow: 0 0 .4cqw rgba(255, 255, 255, .5); }
  :root[lang="ar"] .cv-lbl, :root[lang="ar"] .cv-tag { font-family: 'Alexandria', 'IBM Plex Sans Arabic', sans-serif; line-height: 1.35; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .sig { display: flex; align-items: center; gap: 12px; }
  .sig img { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--red); }
  .sig b { display: block; font: 600 16.5px/1.3 var(--display); color: var(--red); }
  .sig span { display: block; font-size: 13px; line-height: 1.4; color: var(--blue-ink); }

  /* 2 Sector tiles */
  .tiles4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 700px) { .tiles4 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .sec { padding: 16px; } }
  .sec { display: grid; gap: 10px; align-content: start; padding: 18px; border: 1px solid var(--sky-1); border-radius: 22px; background: #FFFFFF; text-align: start; box-shadow: 0 12px 26px -16px rgba(47, 111, 168, .45); cursor: pointer; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .sec:hover { transform: translateY(-3px); border-color: var(--sky); }
  .sec[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 3px rgba(179, 13, 18, .16), 0 12px 26px -16px rgba(47, 111, 168, .45); }
  .gi { display: block; flex: none; width: 24px; height: 24px; overflow: visible; }
  .smark { display: grid; place-items: center; flex: none; width: 68px; height: 68px; border-radius: 21px; background: linear-gradient(160deg, #FFFFFF 0%, var(--sky-2) 100%); box-shadow: inset 0 0 0 1px var(--sky-1), 0 8px 16px -10px rgba(47, 111, 168, .55); }
  .smark .gi { width: 56px; height: 56px; }
  .smark.sm { width: 40px; height: 40px; border-radius: 12px; }
  .smark.sm .gi { width: 32px; height: 32px; }
  .sec-any { border: 1.5px dashed var(--sky); background: linear-gradient(160deg, #FFFFFF 0%, var(--sky-2) 100%); }
  .chip .chip-g { width: 26px; height: 26px; margin-inline-start: -4px; }
  .sec b { font: 500 clamp(17px, 1.7vw, 21px)/1.3 var(--display); }
  :root[lang="ar"] .sec b { font-size: clamp(16px, 1.5vw, 19px); }
  .sec-d { font-size: 14px; line-height: 1.45; color: var(--muted); }

  /* 3 The problem */
  .desk { display: grid; gap: 10px; width: min(100%, 540px); margin: 0 auto; }
  .bubs { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 10px; min-height: 120px; padding-top: 6px; }
  .bub { --r: -2deg; padding: 8px 15px; border: 1.5px solid var(--sky); border-radius: 16px; background: #FFFFFF; color: var(--ink); font: 600 15px/1.45 var(--body); box-shadow: 0 6px 14px rgba(47, 111, 168, .14); transform: rotate(var(--r)); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(.35s + var(--k) * .38s); }
  .bub:nth-child(even) { --r: 2.5deg; }
  .bub.hot { border-color: var(--red); }
  @keyframes pop { from { opacity: 0; transform: scale(.5) rotate(var(--r)); } to { opacity: 1; transform: scale(1) rotate(var(--r)); } }
  .desk-art { position: relative; }
  .desk-art svg { width: 100%; height: auto; }
  .notif { justify-self: center; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px; background: var(--ink); color: #FFFFFF; font-size: 14px; line-height: 1.3; box-shadow: 0 14px 30px -12px rgba(15, 28, 45, .7); animation: drop .5s ease both; animation-delay: .2s; }
  .notif .ic { width: 18px; height: 18px; color: var(--sky); }
  .notif b { font-variant-numeric: tabular-nums; }
  .notif i { display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--red); font: 700 13px/1 var(--body); font-style: normal; }
  @keyframes drop { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }

  /* 4 The phone */
  .phone { width: min(100%, 370px); margin: 0 auto; padding: 11px; border-radius: 40px; background: #0A1424; box-shadow: 0 34px 70px -30px rgba(15, 28, 45, .85), inset 0 0 0 2px #26354F; }
  .phone-screen { position: relative; display: flex; flex-direction: column; height: clamp(380px, calc(100vh - 295px), 600px); overflow: hidden; border-radius: 30px; container-type: inline-size; background: var(--navy); color: #F4F8FD; }
  .phone-screen::before { content: ""; position: absolute; top: 8px; left: 50%; width: 92px; height: 22px; border-radius: 999px; background: #0A1424; transform: translateX(-50%); }
  .phone-head { display: flex; align-items: center; gap: 10px; padding: 40px 16px 12px; border-bottom: 1px solid rgba(156, 195, 234, .22); }
  .phone-head img { width: 36px; height: 36px; border-radius: 50%; }
  .phone-head b { display: block; font: 500 15px/1.3 var(--display); }
  .phone-head small { display: flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.3; color: var(--green-hi); }
  .phone-body { flex: 1; display: grid; gap: 10px; align-content: start; overflow-y: auto; padding: 14px; scroll-behavior: smooth; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; }
  :root[lang="ar"] .msg { line-height: 1.7; }
  :root[lang="ar"] .msg[lang="en"] { line-height: 1.45; }
  .msg.c { justify-self: end; border: 1px solid rgba(156, 195, 234, .3); border-end-end-radius: 5px; background: #1A2C47; }
  .msg.a { justify-self: start; border-end-start-radius: 5px; background: #FFFFFF; color: var(--ink); }
  .typing { justify-self: start; display: inline-flex; gap: 5px; padding: 13px 16px; border-radius: 16px; border-end-start-radius: 5px; background: #FFFFFF; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--sky); animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .tl { justify-self: start; width: 94%; padding: 13px 15px; border-radius: 14px; border-end-start-radius: 4px; background: #FFFFFF; color: var(--ink); }
  .tl-t { display: flex; align-items: center; gap: 8px; padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px solid var(--sky-1); font: 500 14px/1.3 var(--display); color: var(--blue-ink); }
  .tl-t .ic { width: 16px; height: 16px; }
  .tl li { position: relative; display: grid; gap: 1px; padding: 0 0 11px; padding-inline-start: 24px; font-size: 14px; line-height: 1.4; }
  :root[lang="ar"] .tl li { line-height: 1.6; }
  .tl li::before { content: ""; position: absolute; inset-inline-start: 3px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(47, 111, 168, .15); }
  .tl li::after { content: ""; position: absolute; inset-inline-start: 8px; top: 19px; bottom: 2px; width: 1.5px; background: var(--sky); }
  .tl li:last-child { padding-bottom: 0; }
  .tl li:last-child::before { background: var(--green); box-shadow: 0 0 0 3px rgba(91, 143, 46, .18); }
  .tl li:last-child::after { display: none; }
  .tl b { font-size: 12.5px; font-weight: 600; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
  .sent { justify-self: center; display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px; border-radius: 999px; background: rgba(165, 212, 111, .15); color: var(--green-hi); font-size: 13px; line-height: 1.4; }
  .sent .ic { width: 15px; height: 15px; stroke-width: 2.4; }
  .seq:not(.on) { display: none; }
  .seq.on { animation: up .4s ease both; }
  .phone-cap { max-width: 370px; margin: 10px auto 0; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; }
  .asks { display: grid; gap: 8px; }
  .ask-row { display: grid; gap: 8px; }
  .asks-t { font-size: 14px; color: var(--muted); }
  .ask { justify-self: start; padding: 10px 16px; border: 1.5px solid var(--sky); border-radius: 18px; border-end-end-radius: 5px; background: #FFFFFF; color: var(--ink); font: 500 14.5px/1.45 var(--body); text-align: start; cursor: pointer; transition: border-color .2s; }
  .ask:hover { border-color: var(--blue); }
  .ask[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }

  /* 5 The scene */
  .scene { position: relative; width: min(100%, 640px); margin: 0 auto; aspect-ratio: 600 / 420; overflow: hidden; border-radius: 26px; background: #FFFFFF; box-shadow: 0 30px 60px -30px rgba(20, 33, 58, .55); }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; z-index: 2; display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 3px var(--red), 0 10px 20px -6px rgba(20, 33, 58, .45); transform: translate(-50%, -50%); cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .spot::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; animation: ring 1.8s ease-out infinite; }
  .spot .gi { width: 36px; height: 36px; }
  .spot .tick { position: absolute; top: -6px; inset-inline-end: -6px; display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: var(--green); color: #FFFFFF; box-shadow: 0 0 0 2px #FFFFFF; }
  .spot .tick .ic { width: 12px; height: 12px; stroke-width: 3.2; }
  .spot.seen { box-shadow: 0 0 0 3px var(--green), 0 10px 20px -6px rgba(20, 33, 58, .45); }
  .spot.seen::before { animation: none; }
  .spot[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--ink), 0 12px 24px -6px rgba(20, 33, 58, .55); transform: translate(-50%, -50%) scale(1.12); }
  .gmark { display: grid; place-items: center; flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--sky-2); box-shadow: inset 0 0 0 1px var(--sky-1); }
  .gmark .gi { width: 42px; height: 42px; }
  /* The hint that tells people to tap */
  .coach { position: absolute; z-index: 3; margin-top: 36px; pointer-events: none; animation: coachIn .45s cubic-bezier(.2, 1.3, .4, 1) 1.1s both; }
  .coach.again { animation-delay: .35s; }
  .coach-c { transform: translateX(-50%); }
  .coach-l { transform: translateX(-24px); }
  .coach-r { transform: translateX(calc(-100% + 24px)); }
  .coach-in { position: relative; display: flex; align-items: center; gap: 7px; padding: 6px 14px 6px 7px; border-radius: 999px; background: var(--ink); color: #FFFFFF; font: 600 13.5px/1.2 var(--body); white-space: nowrap; box-shadow: 0 12px 24px -10px rgba(15, 28, 45, .75); animation: coachBob 2.4s ease-in-out 1.6s infinite; }
  :root[dir="rtl"] .coach-in { padding: 6px 7px 6px 14px; }
  .coach-in::before { content: ""; position: absolute; top: -5px; width: 12px; height: 12px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); }
  .coach-c .coach-in::before { left: calc(50% - 6px); }
  .coach-l .coach-in::before { left: 18px; }
  .coach-r .coach-in::before { right: 18px; }
  .coach-hand { width: 38px; height: 38px; margin: -14px 0 -4px -4px; animation: tap 1.2s ease-in-out 1.6s infinite; transform-origin: 50% 70%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); }
  @keyframes coachIn { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }
  @keyframes coachBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 4px; } }
  @keyframes tap { 0%, 100% { scale: 1; } 40% { scale: .8; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(179, 13, 18, .55); } 100% { box-shadow: 0 0 0 18px rgba(179, 13, 18, 0); } }
  .count { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .count ol { display: flex; gap: 5px; }
  .count li { width: 22px; height: 6px; border-radius: 3px; background: var(--sky-1); }
  .count li.on { background: var(--green); }
  .spot-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; min-height: 92px; padding: 16px 18px; border: 1px solid var(--sky); border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 28px -18px rgba(47, 111, 168, .5); }
  .spot-card p { font-size: 15.5px; line-height: 1.5; color: var(--muted); }
  .spot-card.empty { grid-template-columns: auto minmax(0, 1fr); border-style: dashed; box-shadow: none; background: rgba(255, 255, 255, .6); }
  .spot-card.empty .ic { width: 26px; height: 26px; color: var(--red); }
  .spot-card.empty .gi { width: 40px; height: 40px; }

  /* 6 Design your AI employee */
  .q { display: grid; gap: 7px; }
  .tbv .t-bot { gap: 14px; }
  .q-t { display: flex; align-items: center; gap: 8px; font: 500 15.5px/1.3 var(--display); }
  .q-t i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #FFFFFF; font: 600 12.5px/1 var(--body); font-style: normal; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1.5px solid var(--sky); border-radius: 999px; background: #FFFFFF; color: var(--ink); font: 500 14.5px/1.35 var(--body); cursor: pointer; transition: background-color .15s, border-color .15s; }
  .opt .ic { width: 17px; height: 17px; color: var(--blue); }
  .opt:hover { border-color: var(--blue); }
  .opt[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  .opt[aria-pressed="true"] .ic { color: var(--green-hi); }
  .idcard { width: min(100%, 430px); margin: 0 auto; overflow: hidden; border: 1px solid var(--sky-1); border-radius: 24px; background: #FFFFFF; box-shadow: 0 30px 60px -30px rgba(20, 33, 58, .55); }
  .after { display: flex; justify-content: center; margin-top: 22px; }
  .after .go { justify-self: auto; }
  .idcard.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.015); } }
  .id-head { display: flex; align-items: center; gap: 14px; padding: 18px; background: linear-gradient(180deg, #D1E1F3 0%, #F0F6FC 100%); border-bottom: 3px solid var(--red); }
  .id-head img { flex: none; width: 66px; height: 66px; border-radius: 50%; box-shadow: 0 0 0 3px #FFFFFF, 0 8px 18px rgba(15, 28, 45, .3); }
  .id-head b { display: block; font: 600 18px/1.3 var(--display); color: var(--red); }
  .id-head span { display: block; font-size: 14px; line-height: 1.4; color: var(--blue-ink); }
  .id-head .who { display: inline; font-size: inherit; color: inherit; }
  .id-online { display: inline-flex !important; align-items: center; gap: 6px; margin-top: 3px; font-size: 12.5px !important; color: var(--green-ink) !important; }
  .id-online::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(91, 143, 46, .2); }
  .id-body { display: grid; gap: 13px; padding: 16px 18px; }
  .id-row { display: grid; gap: 6px; }
  .id-row small { font-size: 12.5px; line-height: 1.3; color: var(--muted); }
  .id-row ul { display: flex; flex-wrap: wrap; gap: 6px; }
  .id-row li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border: 1px solid var(--sky-1); border-radius: 999px; background: var(--sky-2); font-size: 13.5px; line-height: 1.4; }
  .id-row li .ic { width: 15px; height: 15px; color: var(--blue); }
  .id-row li.none { border-style: dashed; color: var(--muted); background: #FFFFFF; }
  .id-foot { display: grid; gap: 8px; padding: 0 18px 18px; }
  .id-foot p { font-size: 12.5px; line-height: 1.5; color: var(--muted); text-align: center; }

  /* 7 Investment */
  .money { display: grid; gap: 16px; width: min(100%, 600px); margin: 0 auto; padding: 22px; border: 1px solid var(--sky-1); border-radius: 26px; background: #FFFFFF; box-shadow: 0 30px 60px -30px rgba(20, 33, 58, .5); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-bottom: 10px; border-bottom: 1px dashed var(--sky); }
  .bar-once { flex: 0 0 24%; height: 100%; border-radius: 8px 8px 0 0; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); transform-origin: bottom; animation: grow .8s .25s cubic-bezier(.2, .7, .2, 1) both; }
  .bar-mo { flex: 1 1 0; height: 13%; border-radius: 4px 4px 0 0; background: var(--green-hi); transform-origin: bottom; animation: grow .4s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(1s + var(--k) * 80ms); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--red-hi); }
  .legend .k-mo { height: 5px; background: var(--green-hi); }
  .legend .k-ext { height: 0; border-radius: 0; background: none; border-top: 1px dashed var(--sky); }
  .money-cap { font-size: 12.5px; color: var(--muted); }
  .path-t { padding-top: 6px; font: 500 15px/1.3 var(--display); color: var(--ink); }
  .path { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .path li { position: relative; display: grid; justify-items: center; gap: 7px; padding: 0 3px; text-align: center; font-size: 13px; line-height: 1.3; color: var(--ink); }
  .path li::after { content: ""; position: absolute; top: 15px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--sky); }
  .path li:last-child::after { display: none; }
  .path i { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #FFFFFF; font: 600 14px/1 var(--body); font-style: normal; box-shadow: 0 0 0 4px #FFFFFF; }
  .path li:last-child i { background: var(--green); }
  .perks { display: flex; flex-wrap: wrap; gap: 8px; }
  .perks li { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px 6px 8px; border: 1px solid var(--sky-1); border-radius: 999px; background: #FFFFFF; font: 500 15px/1.3 var(--display); box-shadow: 0 6px 14px -8px rgba(47, 111, 168, .4); }
  :root[dir="rtl"] .perks li { padding: 6px 8px 6px 14px; }
  .perks .perk-g { width: 34px; height: 34px; }

  /* 8 Hala */
  .portrait { display: grid; justify-items: center; gap: 10px; text-align: center; }
  .halo { position: relative; display: block; width: min(72%, 330px); margin: 26px 0 18px; }
  .halo img { position: relative; z-index: 1; width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 4px solid var(--red); box-shadow: 0 0 0 12px rgba(156, 195, 234, .45), 0 0 0 26px rgba(156, 195, 234, .2), 0 30px 60px -20px rgba(20, 33, 58, .5); }
  .portrait b { font: 600 clamp(24px, 2.5vw, 32px)/1.3 var(--display); letter-spacing: .03em; color: var(--red); }
  :root[lang="ar"] .portrait b { letter-spacing: 0; }
  .portrait > span { font-size: 15px; line-height: 1.45; color: var(--blue-ink); }
  /* Hala's line pops out of her photo as a speech bubble and keeps floating */
  .say { position: absolute; z-index: 3; bottom: 76%; inset-inline-start: 58%; width: max-content; max-width: 236px; margin: 0; padding: 14px 17px 14px 18px; border-radius: 22px; background: #FFFFFF; color: var(--ink); font: 500 16px/1.45 var(--display); text-align: start; box-shadow: 0 0 0 1px var(--sky-1), 0 22px 38px -16px rgba(20, 33, 58, .5); transform-origin: 0 100%; animation: sayIn .7s cubic-bezier(.2, 1.35, .4, 1) .9s both, sayFloat 4.4s ease-in-out 1.7s infinite; }
  :root[dir="rtl"] .say { transform-origin: 100% 100%; line-height: 1.7; }
  .say::before { content: "“"; position: absolute; top: -.42em; inset-inline-start: 12px; color: var(--red); font: 700 46px/1 Georgia, 'Times New Roman', serif; }
  :root[dir="rtl"] .say::before { content: "”"; }
  .say::after { content: ""; position: absolute; bottom: -15px; inset-inline-start: 6px; width: 13px; height: 13px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px var(--sky-1), -11px 14px 0 -3px #FFFFFF; }
  :root[dir="rtl"] .say::after { box-shadow: 0 0 0 1px var(--sky-1), 11px 14px 0 -3px #FFFFFF; }
  @keyframes sayIn { from { opacity: 0; scale: .3; } to { opacity: 1; scale: 1; } }
  @keyframes sayFloat { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 0 -9px; rotate: -1.4deg; } }
  @media (max-width: 919px) {
    .halo { margin-top: 118px; }
    .say { bottom: 103%; left: 50%; inset-inline-start: auto; max-width: min(300px, 86vw); transform: translateX(-50%); transform-origin: 50% 100%; text-align: center; }
    :root[dir="rtl"] .say { left: 50%; transform-origin: 50% 100%; }
    .say::before { inset-inline-start: calc(50% - .25em); top: -.48em; }
    .say::after { inset-inline-start: calc(50% - 6px); }
  }
  .offer { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--sky); border-radius: 20px; background: #FFFFFF; }
  .offer svg { flex: none; width: 56px; height: 56px; }
  .offer b { display: block; font: 600 17px/1.3 var(--display); }
  .offer span { display: block; font-size: 14px; line-height: 1.45; color: var(--green-ink); }

  /* Sheet, toast, menus */
  .sheet { position: absolute; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(15, 28, 45, .45); }
  .sheet[hidden] { display: none; }
  .sheet-card { width: min(760px, 100%); max-height: 86%; overflow-y: auto; padding: 18px 22px 30px; border-radius: 26px 26px 0 0; background: #FFFFFF; box-shadow: 0 -20px 50px rgba(15, 28, 45, .3); animation: sheetUp .3s ease both; }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-h { position: sticky; top: -18px; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -18px -22px 14px; padding: 18px 22px 12px; background: #FFFFFF; border-bottom: 1px solid var(--sky-1); }
  .x { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--sky); border-radius: 50%; background: #FFFFFF; color: var(--ink); cursor: pointer; }
  .x .ic { width: 18px; height: 18px; }
  .sh-sec { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--sky-1); }
  .sh-sec:last-child { border-bottom: 0; }
  .sh-sec p { font-size: 15.5px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border: 1px solid var(--sky-1); border-radius: 999px; background: var(--sky-2); font-size: 13.5px; line-height: 1.45; }
  .tags .ic { width: 15px; height: 15px; color: var(--blue); }
  .acc { border-bottom: 1px solid var(--sky-1); }
  .acc summary { display: flex; align-items: center; gap: 12px; padding: 14px 0; list-style: none; cursor: pointer; font: 500 17px/1.4 var(--display); }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after { content: "+"; margin-inline-start: auto; display: grid; place-items: center; flex: none; width: 28px; height: 28px; border: 1px solid var(--sky); border-radius: 50%; color: var(--red); font: 500 18px/1 var(--body); }
  .acc[open] summary::after { content: "−"; }
  .acc p { padding: 0 0 16px; font-size: 15.5px; color: var(--muted); }
  .toast { position: absolute; z-index: 70; left: 50%; bottom: 96px; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: var(--ink); color: #FFFFFF; font-size: 14.5px; line-height: 1.45; transform: translateX(-50%); box-shadow: 0 16px 40px -16px rgba(15, 28, 45, .7); }
  .toast[hidden] { display: none; }
  .pop { position: absolute; z-index: 40; inset-inline-end: 20px; top: calc(100% + 8px); width: min(360px, calc(100vw - 24px)); padding: 8px; border: 1px solid var(--sky); border-radius: 14px; background: #FFFFFF; box-shadow: 0 24px 60px -18px rgba(15, 28, 45, .55); }
  .pop[hidden] { display: none; }
  .pop-t { padding: 8px 12px 6px; font: 500 14px/1.3 var(--display); color: var(--muted); }
  .pop button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: none; font: 500 15.5px/1.3 var(--body); text-align: start; cursor: pointer; }
  .pop button:hover, .pop button[aria-current="true"] { background: var(--sky-2); }
  .pop .code { display: grid; place-items: center; flex: none; min-width: 40px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--sky-1); color: var(--blue-ink); font: 600 12.5px/1 var(--body); }
  #lang-menu { width: min(250px, calc(100vw - 24px)); }
  .lang-btn { display: none; }

  /* Floating WhatsApp */
  .fab { position: absolute; z-index: 25; bottom: 18px; inset-inline-end: 18px; display: inline-flex; align-items: center; gap: 9px; height: 54px; padding: 0 20px 0 16px; border-radius: 999px; background: linear-gradient(135deg, var(--wa), var(--wa-lo)); color: #FFFFFF; font: 600 16px/1 var(--body); text-decoration: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 14px 30px rgba(31, 95, 39, .45); }
  :root[dir="rtl"] .fab { padding: 0 16px 0 20px; }
  .fab .ic { width: 23px; height: 23px; stroke-width: 2; }
  .fab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: ping 2.4s ease-out 1.2s 3; }
  .fab[hidden] { display: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(56, 142, 60, .55); } 80%, 100% { box-shadow: 0 0 0 18px rgba(56, 142, 60, 0); } }

  /* Notebook tabs along the bottom edge */
  .bot { position: relative; z-index: 30; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 66px; padding: 0 20px; background: var(--sky-2); border-top: 1px solid var(--sky); }
  .nav-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 46px; height: 46px; padding: 0 16px; border: 1px solid var(--sky); border-radius: 12px; background: #FFFFFF; color: var(--blue-ink); font: 600 15px/1 var(--body); cursor: pointer; }
  .nav-btn .ic { width: 18px; height: 18px; }
  .nav-btn.primary { border: 0; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); color: #FFFFFF; box-shadow: 0 6px 14px rgba(142, 1, 7, .28); }
  .nav-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
  .tabs { align-self: start; display: flex; align-items: flex-start; gap: 4px; min-width: 0; margin-top: -1px; padding: 0 14px 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { --tc: #6B7487; flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 13px; border: 1px solid var(--sky); border-top: 0; border-bottom: 3px solid var(--tc); border-radius: 0 0 12px 12px; background: var(--sky-1); color: var(--muted); font: 500 14px/1 var(--body); white-space: nowrap; cursor: pointer; transition: height .18s ease, background-color .18s ease; }
  .tab .ic { width: 16px; height: 16px; color: var(--tc); }
  .tab:hover { background: #FFFFFF; color: var(--ink); }
  .tab.seen { color: var(--ink); }
  .tab[aria-current="true"] { height: 54px; background: #FFFFFF; color: var(--ink); font-weight: 600; border-bottom-width: 4px; box-shadow: 0 10px 18px -8px rgba(20, 33, 58, .3); }
  .s0 { --tc: #6B7487; }
  .s1 { --tc: var(--red); }
  .s2 { --tc: var(--blue); }
  .s3 { --tc: var(--green); }
  .s4 { --tc: var(--ink); }
  noscript p { padding: 40px 24px; }


  /* Motion: one small story per drawing. Each animation ends on the drawing's normal state, so with reduced motion the finished picture is simply there. */
  @keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: calc(6px * var(--dirx)) 0; } }
  @keyframes shine { 0% { transform: translateX(-130%); } 25%, 100% { transform: translateX(130%); } }
  .poster::after, .wa-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 36%, rgba(255, 255, 255, .34) 50%, transparent 64%); transform: translateX(-130%); pointer-events: none; }
  .poster::after { animation: shine 8s ease-in-out 1.4s infinite; }
  .wa-btn { position: relative; overflow: hidden; }
  .wa-btn::after { animation: shine 6s ease-in-out 2.6s infinite; }
  .cv-swoosh path { stroke-dasharray: 170; animation: draw 1s ease .9s both; }
  @keyframes draw { from { stroke-dashoffset: 170; } to { stroke-dashoffset: 0; } }

  /* 2: the four sector icons take turns */
  .idle .gi { animation: 9s ease-in-out infinite both; animation-delay: calc(1.3s + var(--n) * 1.5s); }
  .idle-home .gi { animation-name: wiggle; }
  .idle-edu .gi { animation-name: flip; }
  .idle-beauty .gi { animation-name: twinkle; }
  .idle-estate .gi { animation-name: turn; }
  .idle-food .gi { animation-name: hop; }
  .idle-custom .gi { animation-name: tilt; }
  @keyframes hop { 0%, 14%, 100% { translate: 0 0; } 4% { translate: 0 -7px; } 8% { translate: 0 0; } 11% { translate: 0 -2px; } }
  @keyframes tilt { 0%, 14%, 100% { rotate: 0deg; scale: 1; } 5% { rotate: -10deg; scale: 1.08; } 10% { rotate: 6deg; scale: 1; } }
  @keyframes wiggle { 0%, 14%, 100% { rotate: 0deg; } 3% { rotate: -18deg; } 7% { rotate: 14deg; } 10.5% { rotate: -6deg; } }
  @keyframes flip { 0%, 12%, 100% { scale: 1 1; } 4% { scale: .1 1; } 8% { scale: 1 1; } }
  @keyframes twinkle { 0%, 14%, 100% { scale: 1; rotate: 0deg; } 6% { scale: 1.3; rotate: 72deg; } }
  @keyframes turn { 0%, 14%, 100% { rotate: 0deg; } 6% { rotate: 50deg; } 10% { rotate: -8deg; } }

  /* 3: the phone buzzes with every message, papers drift, stress shows */
  .paper { transform-box: fill-box; transform-origin: center; animation: drift 5.5s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(0, -8px) rotate(6deg); } }
  .buzz { transform-box: fill-box; transform-origin: 50% 90%; animation: buzz .38s linear .35s var(--n, 5); }
  @keyframes buzz { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  .bdg { transform-box: fill-box; transform-origin: center; animation: bdg .38s ease .35s var(--n, 5); }
  @keyframes bdg { 40% { transform: scale(1.35); } }
  .stress path { animation: flick 1.4s ease-in-out infinite both; animation-delay: calc(2.4s + var(--d)); }
  @keyframes flick { 0%, 100% { opacity: 1; } 50% { opacity: .1; } }

  /* 4: the live dot, the avatar thinking, a replay */
  .phone-head small::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--green-hi); animation: live 2s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(165, 212, 111, .6); } 100% { box-shadow: 0 0 0 7px rgba(165, 212, 111, 0); } }
  .phone-head img { border-radius: 50%; }
  .phone-head.thinking img { animation: think 1s ease-in-out infinite; }
  @keyframes think { 50% { box-shadow: 0 0 0 5px rgba(156, 195, 234, .5); } }
  .replay { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid rgba(156, 195, 234, .45); border-radius: 999px; background: rgba(255, 255, 255, .06); color: #F4F8FD; font: 500 12.5px/1 var(--body); cursor: pointer; animation: up .35s ease both; }
  .replay .ic { width: 14px; height: 14px; }
  .replay span { white-space: nowrap; }
  @container (max-width: 360px) { .replay { width: 32px; padding: 0; justify-content: center; } .replay span { display: none; } }
  .replay[hidden] { display: none; }

  /* 5: the night, the typing dots, the plant and the visitor's bubble keep the room alive */
  .tw { animation: twink 3s ease-in-out infinite both; }
  @keyframes twink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  .glow { transform-box: fill-box; transform-origin: center; animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { transform: scale(1); opacity: .14; } 50% { transform: scale(1.3); opacity: .34; } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .dots circle { animation: dot 1.2s ease-in-out infinite both; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  .today { animation: today 2.4s ease-in-out infinite; }
  @keyframes today { 50% { fill: #B30D12; } }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .spots { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .spots .spot { pointer-events: auto; }
  .spot.hit { animation: hit .45s ease; }
  @keyframes hit { 40% { scale: 1.3; } }
  .spot-card.show { animation: cardIn .4s cubic-bezier(.2, .8, .2, 1); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }

  /* 6: the card answers every choice */
  .id-head img { animation: halo 2.8s ease-out infinite; }
  @keyframes halo { 0% { box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 3px rgba(47, 111, 168, .45); } 100% { box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 18px rgba(47, 111, 168, 0); } }
  .id-row li.new, .id-head .who.new { animation: chipIn .5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes chipIn { from { opacity: 0; transform: scale(.55); } }

  /* 7: the five steps light up in turn */
  .path i { animation: step 5s ease-in-out infinite; animation-delay: calc(1.8s + var(--k) * .55s); }
  @keyframes step { 0%, 14%, 100% { scale: 1; box-shadow: 0 0 0 4px #FFFFFF; } 6% { scale: 1.16; box-shadow: 0 0 0 4px #FFFFFF, 0 0 0 10px rgba(47, 111, 168, .28); } }

  /* 8: rings around the portrait, the 20 minutes fill in */
  .halo::before, .halo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--sky); opacity: 0; animation: radar 4.4s ease-out infinite; }
  .halo::after { animation-delay: 2.2s; }
  @keyframes radar { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
  .pie { animation: pie 1.6s ease 1s both; }
  @keyframes pie { from { stroke-dasharray: 0 60; } }
  .hand { transform-box: view-box; transform-origin: 28px 28px; transform: rotate(120deg); animation: hand 1.6s ease 1s both; }
  @keyframes hand { from { transform: rotate(0deg); } }

    .ask-row::-webkit-scrollbar { display: none; }
    .ask { flex: none; max-width: 78%; }
    .opt { padding: 6px 11px; font-size: 14px; }

  @media (max-height: 520px) and (min-width: 560px) {

  @media (prefers-reduced-motion: reduce) {

  }

    var s = t.s6, x = t.sectors[sec()], c = state.cfg, langs = c.langs || langsDefault();
    function opt(group, i, label, ic, on) { return '<button type="button" class="opt" data-cfg="' + group + '" data-i="' + i + '" aria-pressed="' + on + '">' + (ic ? icon(ic) : '') + '<span>' + esc(label) + '</span></button>'; }
    function q(n, label, opts) { return '<div class="q"><p class="q-t"><i>' + n + '</i>' + esc(label) + '</p><div class="opts">' + opts + '</div></div>'; }
    var qs = '<div class="a"' + k(1) + '>' + q(1, s.q1, s.who.map(function (w, i) { return opt('who', i, w, WHO_ICON[i], c.who === i); }).join('')) + '</div>' +
      '<div class="a"' + k(2) + '>' + q(2, s.q2, x.tasks.map(function (tk, i) { return opt('tasks', i, tk[1], tk[0], c.tasks.indexOf(i) >= 0); }).join('')) + '</div>' +
      '<div class="a"' + k(3) + '>' + q(3, s.q3, s.channels.map(function (ch, i) { return opt('ch', i, ch, CH_ICON[i], c.ch.indexOf(i) >= 0); }).join('')) + '</div>' +
      '<div class="a"' + k(4) + '>' + q(4, s.q4, LANG_NAMES.map(function (ln, i) { return opt('langs', i, ln, '', langs.indexOf(i) >= 0); }).join('')) + '</div>';
    var card = '<div class="idcard a"' + k(2) + ' id="idcard">' + cardInner(t) + '</div>';
    return frame(title(esc(s.h)), card + '<div class="after">' + go(s.cta) + '</div>', qs, 'tbv even');
  }

  function s7(t) {
    var s = t.s7, months = '';
    for (var i = 0; i < 9; i++) months += '<span class="bar-mo" style="--k:' + i + '"></span>';
    var money = '<figure class="money a"' + k(1) + '><div class="bars" role="img" aria-label="' + esc(s.chart.label) + '"><span class="bar-once"></span>' + months + '</div>' +
      '<div class="legend"><span><i></i>' + esc(s.chart.once) + '</span><span><i class="k-mo"></i>' + esc(s.chart.monthly) + '</span><span><i class="k-ext"></i>' + esc(s.chart.ext) + '</span></div>' +
      '<p class="money-cap">' + esc(s.chart.cap) + '</p>' +
      '<p class="path-t">' + esc(s.stepsT) + '</p><ol class="path">' + s.steps.map(function (st, i) { return '<li><i style="--k:' + i + '">' + (i + 1) + '</i><span>' + esc(st) + '</span></li>'; }).join('') + '</ol></figure>';
    var perks = '<ul class="perks a"' + k(2) + '>' + s.perks.map(function (p) { return '<li>' + gicon(PERK_ICON[p[0]] || 'own', 'perk-g') + esc(p[1]) + '</li>'; }).join('') + '</ul>';
    return frame(title(esc(s.h)) + '<p class="sub a"' + k(1) + '>' + esc(s.sub) + '</p>', money,
      perks + '<div class="row a"' + k(3) + '><button type="button" class="ghost" data-sheet="details">' + icon('info') + '<span>' + esc(t.ui.details) + '</span></button></div>' + go(s.cta));
  }

  function s8(t) {
    var s = t.s8;
    var portrait = '<figure class="portrait a"' + k(1) + '><span class="halo"><img src="assets/hala.jpg" width="1000" height="1000" alt="' + esc(myName()) + '"><span class="say" role="note">' + esc(s.vow) + '</span></span><b>' + esc(myName()) + '</b><span>' + esc(s.role) + '</span></figure>';
    var links = '<div class="row a"' + k(5) + '>' +
      (CONFIG.email ? '<a class="ghost" href="mailto:' + esc(CONFIG.email) + '" target="_blank" rel="noopener">' + icon('mail') + '<span>' + esc(s.mail) + '</span></a>' : '') +
      (CONFIG.linkedin ? '<a class="ghost" href="' + esc(CONFIG.linkedin) + '" target="_blank" rel="noopener">' + icon('brief') + '<span>' + esc(s.li) + '</span></a>' : '') +
      (CONFIG.instagram ? '<a class="ghost" href="' + esc(CONFIG.instagram) + '" target="_blank" rel="noopener">' + icon('insta') + '<span>' + esc(s.ig) + '</span></a>' : '') +
      '<button type="button" class="ghost" data-sheet="faq">' + icon('help') + '<span>' + esc(s.faqBtn) + '</span></button></div>';
    return frame(title(esc(s.h)) + '<p class="sub a"' + k(1) + '>' + esc(s.sub) + '</p>', portrait,

      '<div class="offer a"' + k(3) + '>' + clockSvg() + '<div><b>' + esc(s.offer) + '</b><span>' + esc(s.offerSub) + '</span></div></div>' +
      (CONFIG.whatsapp ? '<a class="wa-btn a"' + k(4) + ' href="' + esc(CONFIG.whatsapp) + '" target="_blank" rel="noopener">' + icon('chat') + '<span>' + esc(s.wa) + '</span></a>' : '') + links, 'split even');
  }

  var SCREENS = [s1, s2, s3, s4, s5, s6, s7, s8];

  /* ------------------------------ Sheets ------------------------------ */
  function openSheet(kind) {
    var t = T(), h = '', body = '';
    if (kind === 'details') {
      var d = t.s7.details;
      h = t.s7.h;
      body = '<div class="sh-sec"><h3>' + esc(d.p1.t) + '</h3><p>' + esc(d.p1.d) + '</p><ul class="tags">' + d.p1.chips.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="sh-sec"><h3>' + esc(d.p2.t) + '</h3><p>' + esc(d.p2.d) + '</p><ul class="tags">' + d.p2.chips.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="sh-sec"><h3>' + esc(d.ext.t) + '</h3><ul class="tags">' + d.ext.chips.map(function (c) { return '<li>' + icon(c[0]) + '<span>' + esc(c[1]) + '</span></li>'; }).join('') + '</ul><p>' + esc(d.ext.d) + '</p><p>' + esc(d.split) + '</p></div>' +
        '<div class="sh-sec"><h3>' + esc(t.s7.stepsT) + '</h3><ol class="tl" style="width:100%;padding:0">' + d.steps.map(function (st) { return '<li><b>' + esc(st.t) + '</b><span>' + esc(st.d) + '</span></li>'; }).join('') + '</ol><p>' + esc(d.note) + '</p></div>';
    } else {
      var items = t.faq.slice();
      if (state.sector) items.unshift(t.sectors[state.sector].faq);
      h = t.s8.faqT;
      body = items.map(function (x, i) { return '<details class="acc"' + (i === 0 ? ' open' : '') + '><summary>' + esc(x.q) + '</summary><p>' + esc(x.a) + '</p></details>'; }).join('');
    }
    sheetCard.innerHTML = '<div class="sheet-h"><h3 id="sheet-title">' + esc(h) + '</h3><button type="button" class="x" data-close="1" aria-label="' + esc(t.ui.close) + '">' + icon('x') + '</button></div>' + body;
    sheet.hidden = false;
    sheetCard.querySelector('.x').focus();
  }
  function closeSheet() { if (!sheet.hidden) { sheet.hidden = true; var tt = document.getElementById('screen-title'); if (tt) tt.focus({ preventScroll: true }); } }

  /* ------------------------------ The chat plays itself ------------------------------ */
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function playChat() {
    clearTimers();
    var box = document.getElementById('chat');
    if (!box) return;
    var items = Array.prototype.slice.call(box.querySelectorAll('[data-seq]'));
    items.sort(function (a, b) { return a.getAttribute('data-seq') - b.getAttribute('data-seq'); });
    var typing = box.querySelector('.typing');
    var head = screen.querySelector('.phone-head'), status = head && head.querySelector('small');
    var replay = document.getElementById('replay');
    var t = T();
    items.forEach(function (el) { el.classList.remove('on'); });
    if (replay) replay.hidden = true;
    if (reduce) { items.forEach(function (el) { if (el !== typing) el.classList.add('on'); }); if (replay) replay.hidden = false; return; }
    box.scrollTop = 0;
    var at = 450;
    items.forEach(function (el) {
      if (el === typing) {
        timers.push(setTimeout(function () { el.classList.add('on'); box.scrollTop = box.scrollHeight; if (head) head.classList.add('thinking'); if (status) status.textContent = t.ui.typing; }, at));
        at += 1300;
        timers.push(setTimeout(function () { el.classList.remove('on'); if (head) head.classList.remove('thinking'); if (status) status.textContent = t.s4.online; }, at));
        return;
      }
      timers.push(setTimeout(function () {
        el.classList.add('on');
        if (el.parentNode && el.parentNode.closest && el.parentNode.closest('.tl')) el.closest('.tl').classList.add('on');
        box.scrollTop = box.scrollHeight;
      }, at));
      at += el.classList.contains('msg') ? 700 : el.tagName === 'LI' ? 420 : 500;
    });
    timers.push(setTimeout(function () { if (replay) replay.hidden = false; }, at + 400));
  }

  /* The banner's two lines shrink when a language runs longer than the banner. */
  function fitCover() {
    var b = screen.querySelector('.cv-banner');
    if (!b) return;
    var avail = b.clientWidth * 0.86;
    Array.prototype.forEach.call(b.querySelectorAll('.cv-l1, .cv-l2'), function (el) {
      el.style.setProperty('--s', '1');
      var w = el.offsetWidth;
      if (w > avail) el.style.setProperty('--s', (avail / w).toFixed(3));
    });
  }

  /* The phone on the desk counts the messages as they arrive. */
  function countUp() {
    var badge = screen.querySelector('.badge');
    if (!badge || reduce) return;
    var n = Number(badge.textContent) || 0;
    badge.textContent = '1';
    for (var j = 1; j < n; j++) (function (v) { timers.push(setTimeout(function () { badge.textContent = String(v + 1); }, Math.round((0.35 + v * 0.38) * 1000))); })(j);
  }

  /* ------------------------------ Rendering ------------------------------ */
  function render(dir, calm) {
    clearTimers();
    var keep = screen.scrollTop;
    screen.className = 'screen' + (calm ? ' calm' : '') + (dir > 0 ? ' fwd' : dir < 0 ? ' back' : '');
    screen.innerHTML = SCREENS[state.i](T());
    screen.scrollTop = calm ? keep : 0;
    if (state.i === 3) playChat();
    if (state.i === 2) countUp();
    if (state.i === 0) { fitCover(); try { document.fonts.ready.then(fitCover); } catch (e) { /* older browsers */ } }
    chrome();
  }

  function chrome() {
    var t = T(), i;
    root.lang = state.lang;
    root.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.docTitle;
    var brand = document.getElementById('brand');
    brand.querySelector('b').textContent = myName();
    brand.querySelector('.brand-t span').textContent = t.cover.role;
    document.getElementById('langs').setAttribute('aria-label', t.ui.langs);
    Array.prototype.forEach.call(document.querySelectorAll('#langs [data-lang]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === state.lang)); });
    var lb = document.getElementById('lang-btn');
    lb.innerHTML = icon('globe') + '<span>' + esc(LANG_CODE[state.lang]) + '</span>' + icon('down', 'caret');
    lb.setAttribute('aria-label', t.ui.langs);
    document.getElementById('lang-menu').innerHTML = '<p class="pop-t">' + esc(t.ui.langs) + '</p>' + LANGS.map(function (l) {
      return '<button type="button" data-lang="' + l + '" lang="' + l + '" aria-current="' + (l === state.lang) + '"><span class="code">' + esc(LANG_CODE[l]) + '</span><span>' + esc(LANG_LABEL[l]) + '</span></button>';
    }).join('');
    var chip = document.getElementById('sector-btn');
    chip.innerHTML = (state.sector ? gicon(state.sector, 'chip-g') : icon('list')) + '<span>' + esc(state.sector ? t.sectors[state.sector].short : t.ui.sectorNone) + '</span>' + icon('down', 'caret');
    chip.setAttribute('aria-label', t.ui.sectorMenu);
    sectorMenu.innerHTML = '<p class="pop-t">' + esc(t.ui.sectorMenu) + '</p>' + SECTORS.map(function (key) {
      return '<button type="button" data-sector="' + key + '" data-stay="1" aria-current="' + (state.sector === key) + '"><span class="smark sm">' + gicon(key) + '</span><span>' + esc(t.sectors[key].name) + '</span></button>';
    }).join('');
    document.getElementById('rule').style.width = (100 - (state.i + 1) / N * 100) + '%';

    var fab = document.getElementById('fab');
    fab.hidden = !CONFIG.whatsapp || state.i === 5 || state.i === N - 1;
    if (CONFIG.whatsapp) { fab.href = CONFIG.whatsapp; fab.querySelector('span').textContent = t.ui.wa; fab.setAttribute('aria-label', t.ui.waAria); }

    var tabs = '';
    for (i = 0; i < N; i++) {
      var label = i === 1 && state.sector ? t.sectors[state.sector].short : t.tabs[i];
      var ic = i === 1 ? (state.sector ? ICON[state.sector] : 'list') : TAB_ICON[i];
      tabs += '<button type="button" class="tab s' + SECTION[i] + (i < state.i ? ' seen' : '') + '" data-go="' + i + '" aria-current="' + (i === state.i) + '">' + icon(ic) + '<span>' + esc(label) + '</span></button>';
    }
    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = tabs;
    tabsEl.setAttribute('aria-label', t.ui.nav);
    var cur = tabsEl.querySelector('[aria-current="true"]');
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { /* older browsers */ } }
    document.getElementById('bot').setAttribute('aria-label', t.ui.nav);
    var prev = document.getElementById('prev'), next = document.getElementById('next');
    prev.disabled = state.i === 0;
    next.disabled = state.i === N - 1;
    prev.querySelector('span').textContent = t.ui.prev;
    prev.setAttribute('aria-label', t.ui.prev);
    next.querySelector('span').textContent = t.ui.next;
    next.setAttribute('aria-label', t.ui.next);

    var name = state.lang + (state.sector ? '-' + SLUG[state.lang][state.sector] : '');
    try {
      history.replaceState(null, '', '#' + name);
    } catch (e2) { /* some viewers refuse this */ }
    try { localStorage.setItem('booklet-lang', state.lang); } catch (e3) { /* storage may be unavailable */ }
  }

  function goTo(i, focus) {
    i = Math.max(0, Math.min(N - 1, i));
    closeMenus();
    if (i === state.i) return;
    var dir = i > state.i ? 1 : -1;
    state.i = i;
    render(dir);
    if (focus !== false) { var tt = document.getElementById('screen-title'); if (tt) tt.focus({ preventScroll: true }); }
  }
  function closeMenus() {
    sectorMenu.hidden = true; document.getElementById('sector-btn').setAttribute('aria-expanded', 'false');
    document.getElementById('lang-menu').hidden = true; document.getElementById('lang-btn').setAttribute('aria-expanded', 'false');
  }
  var toastTimer = null;
  function say(text) {
    toast.textContent = text; toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 4200);
  }
  function toggle(list, i, min) {
    var at = list.indexOf(i);
    if (at >= 0) { if (list.length > (min || 0)) list.splice(at, 1); } else list.push(i);
    list.sort(function (a, b) { return a - b; });
  }

  /* ------------------------------ Events ------------------------------ */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-sector],[data-go],[data-step],[data-lang],[data-menu],[data-ask],[data-spot],[data-cfg],[data-sheet],[data-close],[data-send],[data-replay]') : null;
    if (!el) {
      if (ev.target === sheet) closeSheet();
      if (!ev.target.closest || !ev.target.closest('.pop')) closeMenus();
      return;
    }
    if (el.hasAttribute('data-send')) {
      var text = cfgMessage(T());
      try {
        navigator.clipboard.writeText(text).then(function () { say(T().ui.copied); }, function () { say(T().ui.copyFail); });
      } catch (e) { say(T().ui.copyFail); }
      return;
    }
    if (el.hasAttribute('data-replay')) { playChat(); var chat = document.getElementById('chat'); if (chat) chat.focus({ preventScroll: true }); return; }
    if (el.hasAttribute('data-close')) { closeSheet(); return; }
    if (el.hasAttribute('data-sheet')) { openSheet(el.getAttribute('data-sheet')); return; }
    if (el.hasAttribute('data-menu')) {
      var menu = el.getAttribute('data-menu') === 'lang' ? document.getElementById('lang-menu') : sectorMenu;
      var was = menu.hidden;
      closeMenus();
      menu.hidden = !was;
      el.setAttribute('aria-expanded', String(was));
      if (was) { var first = menu.querySelector('[aria-current="true"]') || menu.querySelector('button'); if (first) first.focus(); }
      return;
    }
    if (el.hasAttribute('data-sector')) {
      var key = el.getAttribute('data-sector');
      if (key !== state.sector) { state.ask = 0; state.cfg.tasks = [0, 1, 2]; state.spot = -1; state.seen = {}; }
      state.sector = key;
      closeMenus();
      if (state.i === 1 && !el.hasAttribute('data-stay')) { goTo(2); } else { render(0, true); }
      return;
    }
    if (el.hasAttribute('data-ask')) { state.ask = Number(el.getAttribute('data-ask')); render(0, true); return; }
    if (el.hasAttribute('data-spot')) { pickSpot(Number(el.getAttribute('data-spot'))); return; }
    if (el.hasAttribute('data-cfg')) {
      var g = el.getAttribute('data-cfg'), ix = Number(el.getAttribute('data-i')), c = state.cfg, fresh = '';
      if (g === 'who') { if (c.who !== ix) fresh = 'who'; c.who = ix; }
      else {
        if (g === 'langs' && !c.langs) c.langs = langsDefault().slice();
        var list = g === 'tasks' ? c.tasks : g === 'ch' ? c.ch : c.langs;
        if (list.indexOf(ix) < 0) fresh = g + ':' + ix;
        toggle(list, ix);
      }
      refreshCfg(fresh);
      return;
    }
    if (el.hasAttribute('data-go')) { goTo(Number(el.getAttribute('data-go'))); return; }
    if (el.hasAttribute('data-step')) { goTo(state.i + Number(el.getAttribute('data-step'))); return; }
    if (el.hasAttribute('data-lang')) {
      var lg = el.getAttribute('data-lang');
      closeMenus();
      if (lg !== state.lang && LANGS.indexOf(lg) >= 0) { state.lang = lg; state.cfg.langs = null; render(0, true); }
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.key === 'Escape') { closeSheet(); closeMenus(); return; }
    if (!sheet.hidden) return;
    if (ev.target.closest && ev.target.closest('input,textarea,select,.pop')) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); goTo(state.i + fwd()); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goTo(state.i - fwd()); }
  });

  var swipe = null;
  stage.addEventListener('touchstart', function (ev) {
    if (!sheet.hidden) return;
    var p = ev.changedTouches[0];
    swipe = { x: p.clientX, y: p.clientY, at: Date.now() };
  }, { passive: true });
  stage.addEventListener('touchend', function (ev) {
    if (!swipe) return;
    var p = ev.changedTouches[0], dx = p.clientX - swipe.x, dy = p.clientY - swipe.y, quick = Date.now() - swipe.at < 600;
    swipe = null;
    if (quick && Math.abs(dx) > 70 && Math.abs(dy) < 45) goTo(state.i + (dx < 0 ? 1 : -1) * fwd(), false);
  }, { passive: true });

  /* ------------------------------ Start ------------------------------ */
  function readHash() {
    var h = (location.hash || '').replace('#', '').toLowerCase();
    var lang = h.slice(0, 2);
    if (LANGS.indexOf(lang) < 0) return null;
    var rest = h.slice(3), found = null;
    if (rest) ['tr', 'en'].forEach(function (l) { SECTORS.forEach(function (key) { if (SLUG[l][key] === rest) found = key; }); });
    return { lang: lang, sector: found };
  }
  var fromHash = readHash();
  if (fromHash) { state.lang = fromHash.lang; state.sector = fromHash.sector; }
  else {
    var picked = null;
    try { var saved = localStorage.getItem('booklet-lang'); if (LANGS.indexOf(saved) >= 0) picked = saved; } catch (e) { /* storage may be unavailable */ }
    if (!picked) {
      var prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
      for (var pi = 0; pi < prefs.length && !picked; pi++) { var code = String(prefs[pi]).slice(0, 2).toLowerCase(); if (LANGS.indexOf(code) >= 0) picked = code; }
    }
    state.lang = picked || 'en';
  }
  window.addEventListener('hashchange', function () {
    var nx = readHash();
    if (!nx || (nx.lang === state.lang && nx.sector === state.sector)) return;
    state.lang = nx.lang; state.sector = nx.sector; state.cfg.langs = null;
    render(0, true);
  });

  window.booklet = {
    go: goTo, lang: function (l) { state.lang = l; state.cfg.langs = null; render(0, true); },
    pick: function (key) { state.sector = key; render(0, true); },
    spot: pickSpot,
    sheet: openSheet
  };
  render(0);
})();
</script>
